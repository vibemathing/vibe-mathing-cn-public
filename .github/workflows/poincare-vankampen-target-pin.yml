name: Poincare Van Kampen target-pin replay

on:
  push:
    branches:
      - tmp-poincare-vankampen-target-pin-20260917
    paths:
      - diagnostics/run-vankampen-wip-target-pin.sh
      - diagnostics/run-vankampen-wip-target-pin-v2.sh
      - .github/workflows/poincare-vankampen-target-pin.yml

permissions:
  contents: read

jobs:
  vankampen-target-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run patched full Van Kampen colimit replay v2
        shell: bash
        run: bash diagnostics/run-vankampen-wip-target-pin-v2.sh
