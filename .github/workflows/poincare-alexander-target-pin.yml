name: Poincare Alexander target-pin diagnostic

on:
  push:
    branches:
      - tmp-poincare-alexander-trick-20260917
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lean-direct:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install fixed Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 15 --max-time 240 --proto '=https' --tlsv1.2 -sSf -o /tmp/elan-init.sh https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh
          echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh" | sha256sum --check --strict
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0

      - name: Restore pinned Mathlib cache
        working-directory: fixtures/lean-proof
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get

      - name: Direct kernel build and axiom audit
        working-directory: fixtures/lean-proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('VibeMathingFixture.lean')
          s = p.read_text()
          old = '''  · intro j
              change Continuous (fun a => (WithLp.ofLp (g a)) j)
              exact (continuous_apply j).comp ((PiLp.continuous_ofLp 2 _).comp hg)'''
          new = '''  · intro j
              have hj : Continuous (fun a => (WithLp.ofLp (g a)) j) :=
                (continuous_apply j).comp ((PiLp.continuous_ofLp 2 _).comp hg)
              simpa only [Fin.snoc_castSucc] using hj'''
          if old not in s:
              raise SystemExit('continuous_snocLp patch target not found')
          p.write_text(s.replace(old, new))
          PY
          mkdir -p .lake/build/lib/lean
          lake env lean -j1 -o .lake/build/lib/lean/VibeMathingFixture.olean VibeMathingFixture.lean
          lake env lean -j1 AxiomAudit.lean
