name: Poincare three-open cover target-pin probe

on:
  push:
    branches:
      - tmp-poincare-three-open-cover-target-pin-20260919

permissions:
  contents: read

jobs:
  three-open-cover-target-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check three-open cover closure on exact target pin
        shell: bash
        run: bash diagnostics/run-poincare-three-open-cover-target-pin.sh
