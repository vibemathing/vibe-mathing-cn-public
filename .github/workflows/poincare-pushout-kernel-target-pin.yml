name: Poincare Pushout kernel target-pin

on:
  push:
    branches:
      - tmp-poincare-vankampen-target-pin-20260917
    paths:
      - diagnostics/PoincareVanKampenPushoutKernel.lean
      - diagnostics/PoincareTwoOpenCoverKernel.lean
      - diagnostics/PoincareULiftPushoutProbe.lean
      - diagnostics/run-poincare-pushout-kernel-target-pin.sh
      - .github/workflows/poincare-pushout-kernel-target-pin.yml

permissions:
  contents: read

jobs:
  pushout-kernel-target-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run exact-pin pushout kernel
        shell: bash
        run: bash diagnostics/run-poincare-pushout-kernel-target-pin.sh
