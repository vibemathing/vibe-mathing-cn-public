name: Poincare Hatcher global glue exact-pin replay

on:
  push:
    branches:
      - tmp-poincare-vankampen-global-glue-20260917

permissions:
  contents: read

jobs:
  hatcher-global-glue:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run exact-pin Hatcher global row glue probe
        shell: bash
        run: bash diagnostics/run-hatcher-global-glue.sh
